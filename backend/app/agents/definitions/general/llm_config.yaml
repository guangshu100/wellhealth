# ============================================================
# LLM 配置文件 - 通用健康助手 Agent
# ============================================================

# Provider: openai | anthropic | siliconflow | ollama | dashscope
# 通用助手使用开源模型作为默认
provider: siliconflow

# Model: Provider/模型名称
model: Qwen/Qwen2.5-7B-Instruct

# Temperature: 0.0-2.0
# 通用助手需要平衡各种场景
temperature: 0.7

# Max Tokens: 正整数
max_tokens: 2000

# Timeout: 秒数
timeout: 60

# Fallback: 主 Provider 不可用时切换
fallback_provider: null
fallback_model: null
