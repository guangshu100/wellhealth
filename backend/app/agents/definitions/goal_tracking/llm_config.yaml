# ============================================================
# LLM 配置文件 - 目标跟踪 Agent
# ============================================================

# Provider: openai | anthropic | siliconflow | ollama | dashscope
provider: siliconflow

# Model: Provider/模型名称
model: Qwen/Qwen2.5-7B-Instruct

# Temperature: 0.0-2.0
# 跟踪分析需要较低温度，确保数据准确
temperature: 0.3

# Max Tokens: 正整数
max_tokens: 1500

# Timeout: 秒数
timeout: 30

# Fallback: 主 Provider 不可用时切换
fallback_provider: dashscope
fallback_model: qwen-plus
