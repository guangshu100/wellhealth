# ============================================================
# LLM 配置文件 - 营养 Agent
# ============================================================

# Provider: openai | anthropic | siliconflow | ollama | dashscope
# 营养 Agent 使用开源模型，性价比高
provider: siliconflow

# Model: Provider/模型名称
# Qwen2.5-7B: 轻量快速，适合日常对话
# Qwen2.5-72B: 能力更强，但响应较慢
model: Qwen/Qwen2.5-7B-Instruct

# Temperature: 0.0-2.0
# 营养建议可以适度有创意
temperature: 0.7

# Max Tokens: 正整数
max_tokens: 2000

# Timeout: 秒数
timeout: 60

# Fallback: 主 Provider 不可用时切换
fallback_provider: null
fallback_model: null
