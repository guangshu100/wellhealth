# ============================================================
# LLM 配置文件 - 计划验证 Agent
# ============================================================

# Provider: openai | anthropic | siliconflow | ollama | dashscope
# 验证Agent需要高确定性输出
provider: siliconflow

# Model: Provider/模型名称
model: Qwen/Qwen2.5-7B-Instruct

# Temperature: 0.0-2.0
# 验证需要低温度，确保严谨
temperature: 0.2

# Max Tokens: 正整数
max_tokens: 1500

# Timeout: 秒数
timeout: 30

# Fallback: 主 Provider 不可用时切换
fallback_provider: dashscope
fallback_model: qwen-plus
