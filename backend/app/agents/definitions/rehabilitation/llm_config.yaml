# ============================================================
# LLM 配置文件 - 康复指导 Agent
# ============================================================

# Provider: openai | anthropic | siliconflow | ollama | dashscope
provider: siliconflow

# Model: Provider/模型名称
model: Qwen/Qwen2.5-7B-Instruct

# Temperature: 0.0-2.0
temperature: 0.7

# Max Tokens: 正整数
max_tokens: 2000

# Timeout: 秒数
timeout: 60

# Fallback: 主 Provider 不可用时切换
fallback_provider: null
fallback_model: null
