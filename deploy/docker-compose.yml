# ============================================================
# WellHealth 容器化部署编排（仅前后端应用，中间件使用已有实例）
#
# 启动：      docker compose -f deploy/docker-compose.yml up -d --build
# 停止：      docker compose -f deploy/docker-compose.yml down
# 使用本地 Ollama：docker compose -f deploy/docker-compose.yml --profile ollama up -d
# 执行数据库迁移：docker compose -f deploy/docker-compose.yml run --rm backend alembic upgrade head
# ============================================================

services:
  # ---------- 后端 API ----------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: wellhealth-backend:latest
    container_name: wellhealth-backend
    restart: unless-stopped
    # 加载 backend/.env 中的所有环境变量（密钥与 LLM 配置）
    env_file:
      - ../backend/.env
    environment:
      # 中间件连接地址：默认指向宿主机（如需远程/容器，覆盖这些变量即可）
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      QDRANT_HOST: ${QDRANT_HOST:-host.docker.internal}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      # 本地 Ollama（启动 compose 时使用 compose 内置 ollama 服务时可改为 http://ollama:11434）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # 兼容 Windows/macOS/Linux 的"宿主机"寻址
      - "host.docker.internal:host-gateway"
    ports:
      - "18100:18100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------- 前端 Web（Nginx 静态托管 + 反代） ----------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: wellhealth-frontend:latest
    container_name: wellhealth-frontend
    restart: unless-stopped
    ports:
      - "1893:1893"
    depends_on:
      - backend

  # ---------- 可选：本地 Ollama 大模型（默认不启动） ----------
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: wellhealth-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: